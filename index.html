<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>吸吐清波</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><h1>吸吐清波</h1><p class="tag">吸入三種屬性，再吐出清怪</p></header><div class="hud" aria-live="polite"><span id="stats">準備開始</span><span id="status"></span></div><canvas id="game" width="480" height="320" aria-label="吸吐清波遊戲區"></canvas>
